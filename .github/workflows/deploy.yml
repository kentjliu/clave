name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: clave-web
  ECS_CLUSTER: clave
  ECS_SERVICE: clave-web

permissions:
  id-token: write  # required for OIDC
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/clave-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # ── CDK infra ────────────────────────────────────────────────────────────
      # Run first so the ECR repo exists before we try to push to it.
      # On the very first run this deploys with desiredCount=0 (no imageTag yet).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: CDK synth (validate)
        run: npx cdk synth
        working-directory: infra

      - name: CDK deploy infra (without image tag)
        run: npx cdk deploy --require-approval never
        working-directory: infra

      # ── Docker image ──────────────────────────────────────────────────────────
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            ./web
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ── CDK deploy with image tag ─────────────────────────────────────────────
      # Now that the image exists in ECR, redeploy with the imageTag context so
      # CDK creates a new task definition revision pointing to this exact image
      # and brings desiredCount up to 1.
      - name: CDK deploy with image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: npx cdk deploy --require-approval never -c imageTag=$IMAGE_TAG
        working-directory: infra

      - name: Print web URL
        run: |
          echo "Deployed: $(aws cloudformation describe-stacks \
            --stack-name ClaveStack \
            --query 'Stacks[0].Outputs[?OutputKey==`WebUrl`].OutputValue' \
            --output text)"
