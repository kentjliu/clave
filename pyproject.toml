[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clave"
version = "0.1.0"
description = "Version control for FL Studio projects"
requires-python = ">=3.11,<3.12"
dependencies = [
    "watchdog>=4.0",
    "pyflp==2.2.1",
    "boto3>=1.34",
    "click>=8.1",
]

[project.scripts]
clave = "clave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["clave"]
